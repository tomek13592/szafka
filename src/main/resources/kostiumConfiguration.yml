# Kazdy kostium ma:
#   display-name: nazwa wyswietlana
#   material: material itemu do prezentacji
#   custom-model-data: opcjonalne CMD dla resource packa
#   lore: opis w GUI
#   armor: opcjonalne czesci pancerza (helmet/chestplate/leggings/boots) z CMD
#   effects: efekty pasywne (potion effects)
#   abilities: unikalne umiejetnosci (obsluga w kodzie)

