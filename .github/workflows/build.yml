name: Build Plugin

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Install ProtocolLib to local repo
      run: |
        mkdir -p libs
        curl -L -o libs/ProtocolLib.jar https://github.com/dmulloy2/ProtocolLib/releases/download/5.3.0/ProtocolLib.jar
        mvn install:install-file \
          -Dfile=libs/ProtocolLib.jar \
          -DgroupId=com.comphenix.protocol \
          -DartifactId=ProtocolLib \
          -Dversion=5.3.0 \
          -Dpackaging=jar \
          -DgeneratePom=true

    - name: Build with Maven
      run: mvn clean package -B

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: CostumePlugin
        path: target/*.jar
        if-no-files-found: error
